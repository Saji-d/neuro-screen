<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b7cf6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eef0fa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eef0fa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="11.5" width="1000" height="1" fill="url(#line)"/>
  <rect y="10.5" width="140" height="3" rx="1.5" fill="url(#sweep)">
    <animate attributeName="x" values="100;960;100" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g fill="#8b7cf6">
    <rect x="596" y="8" width="8" height="8" transform="rotate(45 600 12)" fill="#0b0e1a" stroke="#8b7cf6" stroke-width="1.2"/>
    <rect x="598" y="10" width="4" height="4" transform="rotate(45 600 12)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
